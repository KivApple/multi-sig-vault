on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

concurrency: deploy

jobs:
  deploy:
    runs-on: teapot

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Deploy
        # The website bucket in Garage is declared in infra-config (apps/garage/app.yaml).
        # rclone, not the AWS CLI: its DELETE requests sign Content-Length, which the proxy in front of Garage drops.
        run: >
          docker run --rm -v "$PWD/dist:/dist:ro"
          -e RCLONE_S3_PROVIDER -e RCLONE_S3_ENDPOINT -e RCLONE_S3_REGION
          -e RCLONE_S3_ACCESS_KEY_ID -e RCLONE_S3_SECRET_ACCESS_KEY
          rclone/rclone:1.76.0 sync --checksum -v /dist :s3:multi-sig.quoi.dev
        env:
          RCLONE_S3_PROVIDER: Other
          RCLONE_S3_ENDPOINT: https://s3.quoi.dev
          RCLONE_S3_REGION: garage
          RCLONE_S3_ACCESS_KEY_ID: GK1f3d8356f8e5792545429824
          RCLONE_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}

  # The blind relay for MetaMask on phones (relay/); infra-config runs the image
  relay:
    runs-on: teapot

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and push
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t ghcr.io/kivapple/multi-sig-vault-relay:latest relay
          docker push ghcr.io/kivapple/multi-sig-vault-relay:latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
