on:
  push:
    branches:
      - master
  # Run by hand after signing a release: puts it at the site root
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency: deploy

jobs:
  deploy:
    runs-on: teapot
    env:
      # The Safe that approves releases (README, "Offline use and updates")
      PUBLIC_RELEASE_SAFE: "0x22222222e8d995EA51841abc49022Fb5eb7C62b4"
      PUBLIC_RELEASE_CHAIN_ID: "1"
      RELEASE_RPC_URLS: https://ethereum-rpc.publicnode.com,https://eth.drpc.org

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        if: github.event_name == 'push'
        run: pnpm test
      - name: Build
        if: github.event_name == 'push'
        run: pnpm build
      - name: Publish
        # The website bucket in Garage is declared in infra-config (apps/garage/app.yaml).
        # A push publishes the build under releases/<id>/ and adds it to releases.json; the site root
        # gets the newest release the Safe approved. A manual run only refreshes the root.
        # rclone, not the AWS CLI: its DELETE requests sign Content-Length, which the proxy in front of Garage drops.
        run: scripts/release/publish.sh ${{ github.event_name == 'workflow_dispatch' && '--promote' || '' }}
        env:
          RCLONE_S3_PROVIDER: Other
          RCLONE_S3_ENDPOINT: https://s3.quoi.dev
          RCLONE_S3_REGION: garage
          RCLONE_S3_ACCESS_KEY_ID: GK1f3d8356f8e5792545429824
          RCLONE_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}

  # The blind relay for MetaMask on phones (relay/); infra-config runs the image
  relay:
    if: github.event_name == 'push'
    runs-on: teapot

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and push
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t ghcr.io/kivapple/multi-sig-vault-relay:latest relay
          docker push ghcr.io/kivapple/multi-sig-vault-relay:latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
